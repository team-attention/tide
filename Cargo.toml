[workspace]
members = [
    "crates/tide-app",
    "crates/tide-e2e-tests",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.51.0"
license = "MIT"
repository = "https://github.com/eatnug/tide"
authors = ["eatnug"]

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = "symbols"

# CI/CD 배포용 (cargo bundle --profile dist -p tide-app)
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
criterion = { version = "0.5", features = ["html_reports"] }

[patch.crates-io]
alacritty_terminal = { path = "crates/alacritty_terminal" }
vte = { path = "crates/vte" }
