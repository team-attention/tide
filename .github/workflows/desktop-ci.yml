name: Desktop CI

# Runs on every push and PR that touches the v2 Electron app (apps/desktop), so a
# commit between release tags can never break the build/tests silently. The release
# workflow (desktop-release.yml) stays the only thing that signs/notarizes/ships.
on:
  push:
    branches: ["**"]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-ci.yml"

# A newer push to the same branch/PR cancels the older in-flight run.
concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required gate: types + behavior tests + production build. Fast (suite ~6s) and
  # needs no secrets. Real-PTY tests self-skip on CI=true (tests/pty-ci-gate.ts).
  verify:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # An auth-free, Playwright-driven full-app e2e (Phase 2.3) is the intended second
  # CI job here. It is blocked on a pre-existing bug: the Tide-API (openai_api) agent
  # cannot be selected through the composer menu (it falls back to codex), so the
  # fake-provider electron smoke can't bind a non-CLI agent without real auth. Once
  # that selection path is fixed, add the auth-free e2e as a second required job.
  # Tracked in docs_v2/implementation/codebase-issues-and-remediation-plan.md.
