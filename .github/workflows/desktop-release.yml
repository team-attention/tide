name: Desktop Release

# v2 (Tide, the Electron desktop app) lives in apps/desktop. It releases on its own
# tag prefix `tide-v*` so it never collides with the v1 Rust terminal's `v*` tags
# (handled by release.yml).
on:
  push:
    tags:
      - "tide-v*"

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"

          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and publish to the desktop releases repo
        env:
          # electron-builder discovers the Developer ID cert in the imported keychain
          # and notarizes every mac artifact (dmg + the zip's app) via notarytool with
          # the Apple credentials below — so an auto-updated app passes Gatekeeper.
          CSC_KEYCHAIN: ${{ env.CSC_KEYCHAIN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: "D86BXTY5VR"
          # PAT with contents:write on the dedicated releases repo
          # (electron-builder.json publish → github eatnug/tide-desktop-releases). The
          # default GITHUB_TOKEN is scoped to THIS repo only and cannot publish to
          # another account/repo, so a separate token secret is required.
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASES_TOKEN }}
        # --publish always: electron-builder builds dmg + zip + latest-mac.yml and
        # creates the release (tagged v${version}) in eatnug/tide-desktop-releases — a
        # Tide-desktop-ONLY repo, so the stock electron-updater GitHub provider always
        # resolves the right "latest" (the v1 Rust app's `v*` releases live elsewhere).
        # The `tide-v*` tag on THIS repo is just the build trigger / code source of
        # truth. See specs/version-management.md.
        run: node scripts/v2-tooling-command.mjs electron-builder --mac --publish always
