name: Desktop Release

# v2 (Tide, the Electron desktop app) lives in apps/desktop. It releases on its own
# tag prefix `tide-v*` so it never collides with the v1 Rust terminal's `v*` tags
# (handled by release.yml).
on:
  push:
    tags:
      - "tide-v*"

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"

          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Package macOS desktop app
        env:
          # electron-builder discovers the Developer ID cert in the imported keychain.
          CSC_KEYCHAIN: ${{ env.CSC_KEYCHAIN }}
        run: npm run package:mac

      - name: Collect release asset
        run: |
          VERSION="${GITHUB_REF_NAME#tide-v}"
          mkdir -p release-assets
          DMG="$(find dist/package-mac -name '*.dmg' | head -1)"
          test -n "$DMG"
          cp "$DMG" "release-assets/Tide-${VERSION}.dmg"
          test -f "release-assets/Tide-${VERSION}.dmg"

      - name: Sign DMG
        env:
          SIGNING_IDENTITY: "Developer ID Application: Jacob Park (D86BXTY5VR)"
        run: |
          VERSION="${GITHUB_REF_NAME#tide-v}"
          codesign --force \
            --sign "$SIGNING_IDENTITY" \
            --timestamp \
            "release-assets/Tide-${VERSION}.dmg"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: "D86BXTY5VR"
        run: |
          VERSION="${GITHUB_REF_NAME#tide-v}"
          DMG_PATH="release-assets/Tide-${VERSION}.dmg"

          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$DMG_PATH"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#tide-v}"
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/Tide-${VERSION}.dmg" \
            --title "Tide v${VERSION}" \
            --generate-notes
