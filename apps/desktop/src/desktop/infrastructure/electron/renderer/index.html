<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tide</title>
    <script>
      // Apply the saved theme synchronously, before CSS paints, so a dark user never sees
      // a flash of the light default. Reads the preference from window.tide.uiPrefs, which
      // the preload pulls from Main via sync IPC — NOT localStorage. The renderer's first synchronous
      // localStorage access at boot blocks ~3.8s while the module loads (an Electron storage
      // stall); window.tide.uiPrefs is an in-process value with no such cost. The preferred
      // matchMedia for the "auto" case is fine (instant) — only localStorage stalls.
      // See main/ui-prefs.ts and docs_v2/specs/thread-list-metadata-first-restore.md.
      (function () {
        try {
          var prefs = (window.tide && window.tide.uiPrefs) || {};
          var saved = prefs["tide.theme"];
          var dark =
            saved === "dark" ||
            ((saved === "auto" || !saved) &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {
          /* default light */
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        min-width: 960px;
        min-height: 640px;
        overflow: hidden;
        background: #fdfdfc;
      }

      [data-theme="dark"] body {
        background: #1a1917;
      }

      .tide-boot-shell {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 220px minmax(440px, 1fr);
        overflow: hidden;
        background: #fdfdfc;
        color: #242424;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .tide-boot-rail {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 18px;
        border-right: 1px solid #e4e2de;
        background: #f4f3f0;
      }

      .tide-boot-main {
        min-width: 0;
        min-height: 0;
        background: #fdfdfc;
      }

      [data-theme="dark"] .tide-boot-shell,
      [data-theme="dark"] .tide-boot-main {
        background: #1a1917;
        color: #ecebe7;
      }

      [data-theme="dark"] .tide-boot-rail {
        border-color: #36332e;
        background: #232220;
      }

      .tide-boot-top-row,
      .tide-boot-main-top {
        height: 52px;
        min-height: 52px;
        -webkit-app-region: drag;
      }

      .tide-boot-top-row {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 16px;
        border-bottom: 1px solid #e4e2de;
      }

      .tide-boot-main-top {
        border-bottom: 1px solid #e4e2de;
      }

      [data-theme="dark"] .tide-boot-top-row,
      [data-theme="dark"] .tide-boot-main-top {
        border-color: #36332e;
      }

      .tide-boot-traffic {
        display: inline-flex;
        gap: 8px;
      }

      .tide-boot-traffic-dot {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: rgba(60, 55, 60, 0.16);
      }

      [data-theme="dark"] .tide-boot-traffic-dot {
        background: rgba(232, 230, 224, 0.14);
      }

      .tide-boot-nav,
      .tide-boot-footer {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 0 10px;
      }

      .tide-boot-nav-row {
        height: 30px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 8px;
      }

      .tide-boot-sections {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 20px;
        overflow: hidden;
        padding: 6px 14px;
      }

      .tide-boot-footer {
        flex: 0 0 auto;
        padding-bottom: 6px;
      }

      .tide-boot-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .tide-boot-row {
        height: 22px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .tide-boot-icon {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        border-radius: 5px;
      }

      .tide-boot-heading {
        width: 38%;
        height: 8px;
        margin-bottom: 4px;
        border-radius: 4px;
      }

      .tide-boot-line {
        height: 9px;
        border-radius: 4px;
      }

      .tide-boot-line--xs { width: 34%; }
      .tide-boot-line--sm { width: 52%; }
      .tide-boot-line--md { width: 60%; }
      .tide-boot-line--lg { width: 78%; }
      .tide-boot-line--xl { width: 84%; }

      .tide-boot-icon,
      .tide-boot-heading,
      .tide-boot-line {
        background: linear-gradient(
          90deg,
          rgba(60, 55, 60, 0.06) 25%,
          rgba(60, 55, 60, 0.13) 37%,
          rgba(60, 55, 60, 0.06) 63%
        );
        background-size: 400% 100%;
        animation: tide-boot-shimmer 1.4s ease infinite;
      }

      [data-theme="dark"] .tide-boot-icon,
      [data-theme="dark"] .tide-boot-heading,
      [data-theme="dark"] .tide-boot-line {
        background: linear-gradient(
          90deg,
          rgba(232, 230, 224, 0.06) 25%,
          rgba(232, 230, 224, 0.13) 37%,
          rgba(232, 230, 224, 0.06) 63%
        );
      }

      @keyframes tide-boot-shimmer {
        0% { background-position: 100% 0; }
        100% { background-position: 0 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .tide-boot-icon,
        .tide-boot-heading,
        .tide-boot-line {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="tide-boot-shell" aria-hidden="true">
        <aside class="tide-boot-rail">
          <div class="tide-boot-top-row">
            <span class="tide-boot-traffic">
              <span class="tide-boot-traffic-dot"></span>
              <span class="tide-boot-traffic-dot"></span>
              <span class="tide-boot-traffic-dot"></span>
            </span>
            <span class="tide-boot-icon"></span>
          </div>
          <div class="tide-boot-nav">
            <div class="tide-boot-nav-row">
              <span class="tide-boot-icon"></span>
              <span class="tide-boot-line tide-boot-line--sm"></span>
            </div>
            <div class="tide-boot-nav-row">
              <span class="tide-boot-icon"></span>
              <span class="tide-boot-line tide-boot-line--xs"></span>
            </div>
          </div>
          <div class="tide-boot-sections">
            <div class="tide-boot-group">
              <span class="tide-boot-heading"></span>
              <div class="tide-boot-row">
                <span class="tide-boot-icon"></span>
                <span class="tide-boot-line tide-boot-line--lg"></span>
              </div>
              <div class="tide-boot-row">
                <span class="tide-boot-icon"></span>
                <span class="tide-boot-line tide-boot-line--md"></span>
              </div>
            </div>
            <div class="tide-boot-group">
              <span class="tide-boot-heading"></span>
              <div class="tide-boot-row">
                <span class="tide-boot-icon"></span>
                <span class="tide-boot-line tide-boot-line--lg"></span>
              </div>
              <div class="tide-boot-row">
                <span class="tide-boot-icon"></span>
                <span class="tide-boot-line tide-boot-line--xl"></span>
              </div>
              <div class="tide-boot-row">
                <span class="tide-boot-icon"></span>
                <span class="tide-boot-line tide-boot-line--sm"></span>
              </div>
            </div>
            <div class="tide-boot-group">
              <span class="tide-boot-heading"></span>
              <div class="tide-boot-row">
                <span class="tide-boot-icon"></span>
                <span class="tide-boot-line tide-boot-line--md"></span>
              </div>
            </div>
          </div>
          <div class="tide-boot-footer">
            <div class="tide-boot-nav-row">
              <span class="tide-boot-icon"></span>
              <span class="tide-boot-line tide-boot-line--sm"></span>
            </div>
          </div>
        </aside>
        <main class="tide-boot-main">
          <div class="tide-boot-main-top"></div>
        </main>
      </div>
    </div>
    <script type="module" src="./renderer-entry.tsx"></script>
  </body>
</html>
